{% extends "base.html" %}{% block title %}Orders{% endblock %}{% block content %}<section class="page-head"><label>ORDER HISTORY</label><h1>Your orders.</h1></section><section class="section">{% for o in orders %}<a class="order-row" href="{{url_for('order',oid=o.id)}}"><div><b>#{{o.id}} · {{o.restaurant.name}}</b><small>{{o.created_at.strftime('%d %b %Y · %I:%M %p')}}</small></div><div><span class="pill">{{o.status}}</span><strong>₹{{o.total|int}}</strong></div></a>{% else %}<div class="empty">No orders yet.</div>{% endfor %}</section>{% endblock %}

{% extends "base.html" %}{% block title %}Explore food{% endblock %}{% block content %}<section class="page-head"><label>EXPLORE FOOD</label><h1>Find something delicious.</h1><form class="search-wide"><input name="q" value="{{q}}" placeholder="Search dishes"><button>Search</button></form></section><section class="section"><div class="chips"><a href="{{url_for('menu',q=q)}}">All</a>{% for c in categories %}<a href="{{url_for('menu',category=c,q=q)}}">{{c}}</a>{% endfor %}</div><div class="food-grid">{% for item in items %}{% include "_food.html" %}{% else %}<div class="empty">No dishes found.</div>{% endfor %}</div></section>{% endblock %}

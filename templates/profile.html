{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block content %}<section class="page-head"><label>MY ACCOUNT</label><h1>Your profile.</h1></section><section class="profile-grid"><form class="form-card" method="post"><div class="profile-head"><div class="avatar large">{{user.name[0].upper()}}</div><div><h2>{{user.name}}</h2><small>{{user.email}}</small></div></div><label>Name<input name="name" value="{{user.name}}" required></label><label>Phone<input name="phone" value="{{user.phone}}"></label><label>New password<input type="password" name="password"></label><button class="primary">Save changes</button></form><div class="form-card"><h2>Saved addresses</h2>{% for a in addresses %}<div class="saved-row"><div><b>{{a.label}}</b><small>{{a.address}}</small></div><form method="post" action="{{url_for('address_delete',aid=a.id)}}"><button class="remove">×</button></form></div>{% endfor %}<h3>Add address</h3><form method="post" action="{{url_for('address_add')}}"><input name="label" placeholder="Home / Office" required><textarea name="address" placeholder="Full address" required></textarea><input name="phone" placeholder="Phone"><label><input type="checkbox" name="is_default"> Default</label><button class="outline-btn">Save address</button></form></div></section>{% endblock %}

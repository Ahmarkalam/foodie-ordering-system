<article class="food-card"><div class="food-img"><img src="{{item.image}}" alt="{{item.name}}"><button class="heart {% if item.id in favorite_ids %}liked{% endif %}" data-food="{{item.id}}">{{'♥' if item.id in favorite_ids else '♡'}}</button></div><div class="food-body"><small>{{item.restaurant.name}} · {{item.category}}</small><div class="food-line"><h3>{{item.name}}</h3><b>₹{{item.price|int}}</b></div><p>{{item.description}}</p><form method="post" action="{{url_for('add_to_cart',fid=item.id)}}"><button class="add-btn">Add to cart <b>+</b></button></form></div></article>
